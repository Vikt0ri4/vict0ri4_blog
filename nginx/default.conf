# vict0ri4_blog 博客容器 nginx
# 同一 pod 内共享网络栈: 只允许反代从本机回环访问, 不向宿主机发布
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 基本安全头
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/wasm
               font/woff2 application/vnd.ms-fontobject;

    # Astro 构建产物 (带内容哈希, 可不可变缓存) — ^~ 防止被下方正则规则覆盖
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pagefind 索引产物 (文件名带哈希)
    location ^~ /pagefind/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 普通静态资源
    location ~* \.(?:css|js|woff2?|ttf|otf|png|jpe?g|gif|webp|avif|svg|ico|xml|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
        access_log off;
    }

    # 页面
    location / {
        try_files $uri $uri/ =404;
    }

    # 404 → Astro 生成的 404 页
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
