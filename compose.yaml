# vict0ri42 — docker compose 入口 (docker compose up -d --build)
# 注: 本机无 compose 时用 scripts/run.sh; podman 亦可配合 docker-compose provider 使用
name: vict0ri4

services:
  blog:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://127.0.0.1/}
    image: vict0ri4-blog:latest
    container_name: vict0ri4-blog
    restart: unless-stopped
    networks:
      vict0ri4:
        ipv4_address: 10.89.88.10
    expose: ["8080"]

  proxy:
    build: ./proxy
    image: vict0ri4-proxy:latest
    container_name: vict0ri4-proxy
    restart: unless-stopped
    depends_on:
      - blog
    ports:
      - "80:80"
    networks: [vict0ri4]

networks:
  vict0ri4:
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.88.0/24
